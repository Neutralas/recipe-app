services:
  postgres:
    image: postgres:18
    container_name: recipe-app-postgres
    environment:
      POSTGRES_USER: recipe_app
      POSTGRES_PASSWORD: recipe_app_password
      POSTGRES_DB: recipe_app
    ports:
      - "5432:5432"
    volumes:
      - recipe-app-postgres-data:/var/lib/postgresql

volumes:
  recipe-app-postgres-data: